daemon off;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;

events {
    worker_connections 128;
}

http {
    # Algunas rutas de SupoClip contienen tokens de compartición.
    log_format trial '$remote_addr $request_method $status $body_bytes_sent';
    access_log /dev/stdout trial;
    server_tokens off;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 3080;
        server_name _;
        client_max_body_size 2m;
        client_body_timeout 30s;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 65s;
        proxy_read_timeout 65s;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # El ensayo no reenvía los rewrites de analítica de Next.
        location = /api/events { return 404; }
        location = /js/script.js { return 404; }
        location = /ingest { return 404; }
        location ^~ /ingest/ { return 404; }

        location = /upload {
            if ($request_method != POST) { return 405; }
            if ($http_x_supoclip_signature = "") { return 401; }
            client_max_body_size 65m;
            proxy_request_buffering off;
            proxy_pass http://backend:8000/upload;
        }

        # Next conserva sesión, rutas /api, estáticos y respuestas SSE.
        location / {
            proxy_pass http://frontend:3000;
        }
    }
}
