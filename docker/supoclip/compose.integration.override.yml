services:
  migrate:
    volumes:
      - type: bind
        source: ${MEDIA_SUPOCLIP_TRIAL_PRISMA_BIN:?Falta el binario Prisma verificado}
        target: /run/supoclip/prisma-bin
        read_only: true
        bind: {create_host_path: false}
  frontend:
    # Compose añade estas rutas al /tmp del contrato base.
    tmpfs:
      - /opt/supoclip/frontend/.next/cache:rw,nosuid,nodev,noexec,size=64m,uid=1000,gid=1000,mode=0700
      - /opt/supoclip/frontend/.next/server/route-cache:rw,nosuid,nodev,noexec,size=16m,uid=1000,gid=1000,mode=0700
  worker:
    # El resolver interno de Docker conserva los alias de los servicios.
    dns: [127.0.0.1]
  proxy:
    # La imagen del sitio Kitsu comprueba su configuración y puerto propios.
    healthcheck:
      disable: true
