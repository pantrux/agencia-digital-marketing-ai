user www-data;
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 128;
}

http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 192.168.0.8:9444 ssl;
    server_name grafana-lan.e-scale.cl;

    ssl_certificate /etc/agency-grafana/fullchain.pem;
    ssl_certificate_key /etc/agency-grafana/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow 192.168.0.0/24;
    deny all;

    location = / {
        return 302 /grafana/;
    }

    location /grafana/ {
        proxy_pass http://192.168.48.8:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $agency_grafana_connection;
        proxy_set_header Origin $agency_grafana_origin;
        proxy_set_header Accept-Encoding "";
        proxy_redirect https://pantrux.duckdns.org:8443/grafana/ https://grafana-lan.e-scale.cl:9444/grafana/;
        sub_filter_once off;
        sub_filter 'https://pantrux.duckdns.org:8443/grafana/' 'https://grafana-lan.e-scale.cl:9444/grafana/';
    }

    location / {
        return 404;
    }
  }

  map $http_upgrade $agency_grafana_connection {
    default upgrade;
    '' close;
  }

  map $http_origin $agency_grafana_origin {
    default $http_origin;
    'https://grafana-lan.e-scale.cl:9444' 'https://pantrux.duckdns.org:8443';
  }
}
