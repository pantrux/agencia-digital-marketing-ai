daemon off;
worker_processes 1;
pid /tmp/nginx.pid;
# El registro de errores de Nginx puede incluir la consulta original.
error_log /dev/null;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format kitsu '$remote_addr "$request_method $uri" $status $body_bytes_sent';
    access_log /dev/stdout kitsu;
    server_tokens off;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Volver a resolver los servicios Zou cuando Docker cambie sus direcciones.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream kitsu_api {
        zone kitsu_api 64k;
        server zou-api:5000 resolve;
    }

    upstream kitsu_events {
        zone kitsu_events 64k;
        server zou-events:5001 resolve;
    }

    server {
        listen 8081;
        server_name _;
        root /opt/kitsu/dist;
        index index.html;

        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_intercept_errors off;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /api { return 404; }
        location ^~ /api/ {
            client_max_body_size 128m;
            proxy_request_buffering off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            # La cookie de renovación debe acompañar la ruta pública bajo /api.
            proxy_cookie_path /auth/refresh-token /api/auth/refresh-token;

            # Subidas de revisión y adjuntos. Zou guarda el cuerpo temporal en disco.
            location ~ ^/api/(pictures/preview-files/[0-9a-f-]+|actions/tasks/[0-9a-f-]+/comments/[0-9a-f-]+/add-attachment)$ {
                client_max_body_size 512m;
                rewrite ^/api(/.*)$ $1 break;
                proxy_pass http://kitsu_api;
            }

            proxy_pass http://kitsu_api/;
        }

        location = /socket.io { return 404; }
        location ^~ /socket.io/ {
            proxy_buffering off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://kitsu_events;
        }

        location = /assets { return 404; }
        location ^~ /assets/ { try_files $uri =404; }
        location ^~ /fonts/ { try_files $uri =404; }
        location ~ \.[^/]+$ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
